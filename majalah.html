<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGL MAGAZINE - Kelompok 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
        }
        .main-container {
            max-width: 1400px;
            width: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .back-btn {
            align-self: flex-start;
            color: #666666;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
            font-size: 14px;
        }
        .back-btn:hover { color: #000000; }

        .group-header { text-align: center; padding: 10px 0; }
        .group-header h2 { margin: 0; color: #222222; font-size: 32px; font-weight: 800; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 12px; }

        .magazine-section {
            background: #ffffff;
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            height: 750px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }
        .magazine-section iframe { width: 100%; height: 100%; border: none; }

        .comment-section { 
            background: #fafafa; 
            border: 1px solid #eaeaea; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
        }
        .comment-section h3 { margin-top: 0; color: #222222; font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        input[type="text"], textarea { background: #ffffff; border: 1px solid #dddddd; padding: 14px; border-radius: 8px; color: #333333; font-family: inherit; font-size: 14px; }
        input[type="text"]:focus, textarea:focus { outline: none; border-color: #000000; }
        .submit-comment-btn { background: #222222; color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; transition: background 0.2s; }
        .submit-comment-btn:hover { background: #444444; }
        
        .comment-list { border-top: 1px solid #eaeaea; padding-top: 20px; max-height: 450px; overflow-y: auto; }
        .comment-box { 
            background: #ffffff; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            border: 1px solid #eaeaea;
            border-left: 4px solid #222222;
        }
        .comment-box strong { color: #222222; font-size: 14px; font-weight: 600; }
        .comment-box p { margin: 6px 0 0 0; font-size: 13px; color: #555555; line-height: 1.5; }

        /* --- STYLE BARU: NOTIFIKASI POPUP POP-UP TERIMA KASIH --- */
        .thank-you-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border: 1px solid #eeeeee;
            text-align: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .thank-you-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .thank-you-popup i {
            font-size: 55px;
            color: #ef4444; /* Warna Merah Hati */
            margin-bottom: 15px;
            display: inline-block;
            animation: heartBeat 0.8s infinite alternate;
        }
        .thank-you-popup h4 { margin: 0 0 8px 0; font-size: 20px; color: #222222; font-weight: 700; }
        .thank-you-popup p { margin: 0; font-size: 14px; color: #666666; }
        
        /* Efek overlay blur di belakang popup */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            z-index: 9998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .popup-overlay.show { opacity: 1; visibility: visible; }

        /* Animasi Hati Berdegup */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="popup-overlay" id="popupOverlay"></div>
    <div class="thank-you-popup" id="thankYouPopup">
        <i class="fa-solid fa-heart"></i>
        <h4>Terima Kasih!</h4>
        <p>Komentar dan ulasan Anda berhasil dikirim.</p>
    </div>

    <div class="main-container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali ke Dashboard</a>

        <header class="group-header">
            <h2><i class="fa-solid fa-users"></i> KELOMPOK 5</h2>
        </header>

        <section class="magazine-section">
            <iframe src="https://online.fliphtml5.com/pop_culture/xhbo/" allowfullscreen="true"></iframe>
        </section>

        <div class="comment-section">
            <h3><i class="fa-solid fa-comments"></i> Beri Penilaian & Tanggapan (Real-time)</h3>
            <form id="commentForm">
                <input type="text" id="nama" placeholder="Nama Anda" required>
                <textarea id="isiKomentar" rows="4" placeholder="Tulis pendapat anda atau jawab kuis tadi ya..." required></textarea>
                <button type="submit" class="submit-comment-btn">Kirim Ulasan</button>
            </form>
            
            <div class="comment-list" id="commentList">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD4PeRoQEH6fgA-KOo8YSlur5wXjqX9fKU",
            authDomain: "smart-laundry-tracking-89f97.firebaseapp.com",
            databaseURL: "https://smart-laundry-tracking-89f97-default-rtdb.firebaseio.com",
            projectId: "smart-laundry-tracking-89f97",
            storageBucket: "smart-laundry-tracking-89f97.firebasestorage.app",
            messagingSenderId: "1008506552416",
            appId: "1:1008506552416:web:096da539b1a555585a4305",
            measurementId: "G-YEDS6GJ997"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const komentarRef = ref(db, "komentar_majalah");

        onValue(komentarRef, (snapshot) => {
            const listContainer = document.getElementById("commentList");
            listContainer.innerHTML = ""; 

            if (!snapshot.exists()) {
                listContainer.innerHTML = `<p style="color: #999; font-size: 13px; text-align: center;">Belum ada ulasan. Jadilah yang pertama!</p>`;
                return;
            }

            const data = snapshot.val();
            Object.keys(data).reverse().forEach((key) => {
                const item = data[key];
                let box = document.createElement('div'); 
                box.className = 'comment-box'; 
                box.innerHTML = `<strong>${item.nama}</strong><p>${item.isi}</p>`;
                listContainer.appendChild(box);
            });
        });

        // Kodingan kirim data + memunculkan efek popup cinta
        document.getElementById("commentForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const namaInput = document.getElementById('nama');
            const isiInput = document.getElementById('isiKomentar');

            try {
                await push(komentarRef, {
                    nama: namaInput.value,
                    isi: isiInput.value,
                    timestamp: Date.now()
                });
                
                isiInput.value = ""; // Kosongkan ketikan chat

                // JALANKAN EFEK POPUP LOVE
                const overlay = document.getElementById("popupOverlay");
                const popup = document.getElementById("thankYouPopup");
                
                overlay.classList.add("show");
                popup.classList.add("show");

                // Sembunyikan otomatis popup-nya setelah 3 detik
                setTimeout(() => {
                    overlay.classList.remove("show");
                    popup.classList.remove("show");
                }, 3000);

            } catch (error) {
                alert("Gagal mengirim komentar: " + error.message);
            }
        });
    </script>
</body>
</html>
